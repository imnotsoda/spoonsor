<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🥄</text></svg>" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spoonsor</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap"
        rel="stylesheet" />
    <style>
        :root {
            --gold: #CFB991;
            --black: #111111;
            --surface: #1A1A1A;
            --border: #333333;
            --text: #F0EDE8;
            --muted: #888888;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--black);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1rem;
        }

        .logo {
            font-family: 'Syne', sans-serif;
            font-weight: 800;
            font-size: 2.5rem;
            color: var(--gold);
            margin-bottom: 0.5rem;
        }

        .tagline {
            color: var(--muted);
            font-size: 0.95rem;
            margin-bottom: 2.5rem;
            text-align: center;
        }

        .btn-group {
            display: flex;
            gap: 1rem;
        }

        .btn {
            padding: 0.85rem 2rem;
            border-radius: 8px;
            font-family: 'Syne', sans-serif;
            font-weight: 700;
            font-size: 1rem;
            text-decoration: none;
            transition: opacity 0.2s, transform 0.1s;
            cursor: pointer;
        }

        .btn:hover {
            opacity: 0.85;
        }

        .btn:active {
            transform: scale(0.97);
        }

        .btn-primary {
            background: var(--gold);
            color: var(--black);
        }

        .btn-secondary {
            background: var(--surface);
            color: var(--text);
            border: 1px solid var(--border);
        }
    </style>
</head>

<body>
    <div class="logo">🥄 Spoonsor</div>
    <p class="tagline">Support your campus orgs every time you eat out.</p>
    <div class="btn-group">
        <a href="student.html" class="btn btn-primary">Browse Deals</a>
        <a href="admin.html" class="btn btn-secondary">Admin</a>
    </div>
</body>

</html>
